# Air config untuk News API — hot reload dev server
# cmd = build saja, bin = binary yang dijalankan Air
# (pisah keduanya supaya Air bisa kill & restart proses dengan benar)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/bin/news-api ./cmd/server"
  bin = "tmp/bin/news-api"
  include_ext = ["go", "sql", "yaml", "yml", "toml"]
  exclude_dir = ["tmp", "docs", "bin", "dist", "node_modules"]
  exclude_regex = ["_test\\.go$", "docs\\.go$"]
  exclude_unchanged = true
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
