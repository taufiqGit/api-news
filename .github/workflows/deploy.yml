name: DEployyy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
          registry: ghcr.io

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
              ghcr.io/${{ env.IMAGE_NAME_LOWER }}:latest
              ghcr.io/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}

      - name: Build and push migrations image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.migrations
          push: true
          tags: |
              ghcr.io/${{ env.IMAGE_NAME_LOWER }}-migrations:latest
              ghcr.io/${{ env.IMAGE_NAME_LOWER }}-migrations:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |

            set -e

            cd ${{ secrets.SERVER_PATH }}

            export IMAGE_TAG=${{ github.sha }}
            export IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_TOKEN }}" 
