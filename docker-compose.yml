services:
  news-api:
    build: .
    container_name: news-api-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_ENV: "production"
      APP_URL: "https://api-news.deployaja.web.id"
      DB_HOST: "news-postgres"
      DB_PORT: "5432"
      DB_USER: "news"
      DB_PASSWORD: "news_secret_2026"
      DB_NAME: "news_db"
      DB_SSLMODE: "disable"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      JWT_EXPIRES_IN_HOURS: "24"
      S3_ENDPOINT: "${S3_ENDPOINT:-nos.jkt-1.neo.id}"
      S3_REGION: "${S3_REGION:-jkt}"
      S3_BUCKET: "${S3_BUCKET:-news}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_USE_SSL: "${S3_USE_SSL:-true}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-https://nos.jkt-1.neo.id}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
      SCHEDULER_INTERVAL_MINUTES: "${SCHEDULER_INTERVAL_MINUTES:-10}"
      SCHEDULER_MAX_CONCURRENCY: "${SCHEDULER_MAX_CONCURRENCY:-3}"
      SCHEDULER_DEFAULT_STATUS: "${SCHEDULER_DEFAULT_STATUS:-published}"
      NEWS_ITEMS_PER_WEBSITE: "${NEWS_ITEMS_PER_WEBSITE:-5}"
      AI_PROVIDER: "${AI_PROVIDER:-openai}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      AI_MAX_TOKENS: "${AI_MAX_TOKENS:-0}"
      AI_TEMPERATURE: "${AI_TEMPERATURE:-0.7}"
    networks:
      - news-net
    depends_on:
      - news-postgres

  news-postgres:
    image: postgres:16-alpine
    container_name: news-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "news"
      POSTGRES_PASSWORD: "news_secret_2026"
      POSTGRES_DB: "news_db"
    volumes:
      - news-postgres-data:/var/lib/postgresql/data
    networks:
      - news-net

networks:
  news-net:
    driver: bridge

volumes:
  news-postgres-data:
    external: true
